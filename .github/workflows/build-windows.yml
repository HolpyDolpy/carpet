name: Build and publish Windows EXE

on:
  push:
    branches: [main]
    paths:
      - "windows-app/**"
      - ".github/workflows/build-windows.yml"
  workflow_dispatch:

concurrency:
  group: carpets-windows-main-release
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: windows-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: windows-app/go.mod
          cache: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Create the branded carpet icon
        run: |
          python -m pip install pillow==11.3.0
          python tools/generate_icon.py

      - name: Download WebView2 desktop dependency
        run: go mod tidy

      - name: Test sales files, backup and recovery
        run: go test ./...

      - name: Embed icon in Windows executable
        run: go run github.com/akavel/rsrc@v0.10.2 -ico assets/CarpetsAmeer.ico -o rsrc_windows_amd64.syso

      - name: Build native-window Windows 64-bit EXE
        run: go build -trimpath -ldflags="-s -w -H windowsgui" -o Carpets_Ameer_Windows_SafeSave.exe .

      - name: Verify the compiled EXE
        shell: pwsh
        run: |
          $exe = 'Carpets_Ameer_Windows_SafeSave.exe'
          if (!(Test-Path $exe)) { throw 'Executable missing' }
          if ((Get-Item $exe).Length -lt 1000000) { throw 'Unexpectedly small EXE' }
          Write-Host "Windows EXE: $((Get-Item $exe).Length) bytes"

      - uses: actions/upload-artifact@v4
        with:
          name: Carpets_Ameer_Windows_Desktop_v2
          path: windows-app/Carpets_Ameer_Windows_SafeSave.exe
          if-no-files-found: error

      - name: Publish direct-download EXE to GitHub Releases
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: windows-v2.2.1
          target_commitish: ${{ github.sha }}
          name: "Carpets Ameer — Windows Desktop v2.2.1"
          body: |
            ## Windows application — download directly

            Click **Carpets_Ameer_Windows_SafeSave.exe** under **Assets** below, not Source code.

            This release opens in its own resizable Windows desktop window with a burgundy-and-gold carpet icon. It does not open a browser tab.

            - Windows 10/11 (64-bit)
            - Bilingual Arabic / English sales ledger
            - Fixed Windows file picker with reliable Arabic/English file path handling
            - Linked Excel workbook, verified updates and local backups
            - Microsoft Edge WebView2 Runtime required (included on most updated Windows PCs)
            - No Java or Microsoft Store installation needed

            This app is not commercially code-signed, so Microsoft Defender SmartScreen may warn on first use. Download only from this repository and keep Defender enabled.
          files: windows-app/Carpets_Ameer_Windows_SafeSave.exe
          fail_on_unmatched_files: true
          draft: false
          prerelease: false
